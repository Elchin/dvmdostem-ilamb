# Stage 4/5: ILAMB confrontation config for DVMDOSTEM Site-Runs vs ABCFlux/fallback obs.

[h1: Site Runs Carbon Fluxes]
bgcolor = "#ECFFE6"

[h2: Gross Primary Productivity]
variable = "gpp"
alternate_vars = "GPP"
cmap = "Greens"
weight = 5
mass_weighting = True
skip_iav = True
skip_rmse = False

[SiteRuns_Obs]
source = "DATA/gpp/SiteRuns_Obs/gpp.nc"
weight = 10
table_unit = "g m-2 d-1"
plot_unit = "g m-2 d-1"

